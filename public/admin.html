<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Manzil Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#F6F1E8;--sand2:#EFE7DA;--sand3:#E6DCCB;--ink:#1C1917;--ink2:#44403C;--mut:#78716C;--terra:#C45C26;--terra-d:#A64B1D;--olive:#6B7F5A;
  --bg:var(--sand);--card:#FFFDF9;--line:rgba(28,25,23,.12);--line2:rgba(28,25,23,.07);--brand:var(--terra);
  --navy:var(--ink);--navy2:#292524;--navy3:#3a332d;
  --ok:#4F6B3E;--warn:#B7791F;--bad:#B4402A;
  --c1:#C45C26;--c2:#6B7F5A;--c3:#C99A3C;--c4:#7A6A8F;--c5:#4E7C86;--r:14px;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171412;--card:#211d1a;--ink:#F3EEE6;--ink2:#D6CEC3;--mut:#A8A29E;--line:rgba(243,238,230,.14);--line2:rgba(243,238,230,.08);--sand2:#2a2521;--sand3:#332d28}}
*{box-sizing:border-box}html,body{margin:0}
body{font:400 14.5px/1.5 var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
aside{background:#1C1917;color:#D6CEC3;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;border-inline-end:1px solid #000}
.logo{display:flex;gap:11px;align-items:center;padding:2px 10px 22px;color:#F6F1E8;font-family:var(--serif);font-weight:420;font-size:24px;letter-spacing:-.02em}
.logo i{width:34px;height:34px;border-radius:50%;border:1px solid rgba(246,241,232,.5);display:grid;place-items:center;font-style:normal;font-size:16px;position:relative}
.logo i::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--terra);top:6px}
.logo small{display:block;font-family:var(--sans);font-weight:400;color:#A8A29E;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
nav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;color:#D6CEC3;text-decoration:none;cursor:pointer;margin:1px 0;font-size:14px}
nav a:hover{background:rgba(246,241,232,.06);color:#fff}nav a.on{background:#F6F1E8;color:#1C1917;font-weight:500}
nav .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;color:#8a817a;padding:18px 12px 6px}
.who{margin-top:22px;padding:14px;border-radius:12px;background:rgba(246,241,232,.06);font-size:12px;color:#A8A29E}
.who b{color:#F6F1E8;display:block;font-size:13px}
.who .btn{background:transparent;color:#F6F1E8;border-color:rgba(246,241,232,.25)}.who .btn:hover{border-color:#F6F1E8}
main{padding:34px 40px 60px;min-width:0;max-width:1480px}
h1{font-family:var(--serif);font-weight:350;font-size:38px;line-height:1.08;letter-spacing:-.02em;margin:0 0 6px}
.sub{color:var(--mut);margin-bottom:22px;max-width:70ch}
h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1.2fr 1.8fr}
.card{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:20px;min-width:0;box-shadow:0 1px 0 var(--line2)}
.card h3{margin:0 0 12px;font-size:19px}
.kpi .lbl{color:var(--mut);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.kpi .val{font-family:var(--serif);font-weight:380;font-size:34px;letter-spacing:-.02em;margin:6px 0 2px}.kpi .d{font-size:12px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.btn{border:1px solid var(--line);background:transparent;padding:8px 16px;border-radius:999px;cursor:pointer;font-size:13.5px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:background .2s,border-color .2s,color .2s}
.btn:hover{border-color:var(--ink)}.btn.p{background:var(--ink);border-color:var(--ink);color:var(--sand)}.btn.p:hover{background:#000}
.btn.d{background:var(--bad);border-color:var(--bad);color:#fff}.btn.s{padding:5px 12px;font-size:12.5px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.p{background:var(--sand);color:#1C1917;border-color:var(--sand)}}
input,select,textarea{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--terra);box-shadow:0 0 0 3px rgba(196,92,38,.14)}
label{font-size:13px;color:var(--ink2);display:grid;gap:6px}
label:has(>input[type=checkbox]){display:inline-flex;align-items:center;gap:8px;cursor:pointer}
input[type=checkbox]{accent-color:var(--terra);width:16px!important;height:16px;padding:0;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{width:auto}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;font-size:13.5px}
.tabs button.on{color:var(--ink);border-color:var(--terra);font-weight:500}
.tw{overflow:auto}table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--mut);text-align:left;font-weight:500;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.1em;text-transform:uppercase}
td{padding:12px 10px;border-bottom:1px solid var(--line2);vertical-align:top}tr:hover td{background:rgba(196,92,38,.035)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:500;background:var(--sand2);color:var(--ink2)}
.pill.ok{background:#E4EBDD;color:#3E5530}.pill.warn{background:#F6E7C8;color:#7A5212}.pill.bad{background:#F5DCD3;color:#8E2F1C}.pill.info{background:#F3E1D5;color:#8A3E16}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px}
.muted{color:var(--mut)}.small{font-size:12px}
.modal{position:fixed;inset:0;background:rgba(28,25,23,.5);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:16px}
.modal>div{background:var(--card);border-radius:18px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.modal h3{font-size:26px;margin:0 0 14px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:var(--sand);padding:12px 18px;border-radius:12px;z-index:99;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.err{background:var(--bad);color:#fff}
.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(180deg,rgba(28,25,23,.35),rgba(28,25,23,.65)),url('https://images.unsplash.com/photo-1715824633691-1fd2bfd3a1ac?auto=format&fit=crop&w=1800&q=70') center/cover #1C1917}
.login form{background:rgba(255,253,249,.97);padding:34px;border-radius:20px;width:100%;max-width:410px;display:grid;gap:12px;box-shadow:0 30px 80px rgba(0,0,0,.35);color:#1C1917}
.login form h2{font-size:30px;margin:0;font-weight:350}
.login .logo{color:#1C1917;padding:0 0 6px}.login .logo i{border-color:rgba(28,25,23,.4)}.login .logo small{color:#78716C}
.login .btn.p{min-height:46px;justify-content:center;background:#1C1917;color:#F6F1E8}
.login input{background:#fff;color:#1C1917;border-color:rgba(28,25,23,.15)}
.bar{height:6px;border-radius:99px;background:var(--sand2);overflow:hidden}.bar i{display:block;height:100%;background:var(--terra)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.note{background:#F8EEDC;border:1px solid #E7D3AE;border-inline-start:3px solid var(--terra);color:#5E4220;border-radius:10px;padding:11px 14px;font-size:13px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .note{background:#2c241b;color:#EBD7B5;border-color:#4a3b28}}
.qr{display:grid;place-items:center;padding:12px;background:#FFFDF9;border-radius:12px;border:1px solid var(--line2);margin:4px 0}.qr img,.qr canvas{display:block}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 18px}
.mtop{display:none}
.dbgrid{grid-template-columns:220px 1fr}
@media(max-width:1000px){
 .app{grid-template-columns:1fr}
 .mtop{display:flex;position:sticky;top:0;z-index:40;align-items:center;justify-content:space-between;gap:10px;background:#1C1917;color:#F6F1E8;padding:10px 14px}
 .mtop .logo{padding:0;font-size:20px}.mtop button{background:rgba(246,241,232,.1);border:0;color:#F6F1E8;border-radius:12px;min-width:44px;min-height:44px;font-size:20px;cursor:pointer}
 aside{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);height:100vh;z-index:60;transform:translateX(-105%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.35)}
 aside.open{transform:none}aside .logo{display:none}
 .scrim{position:fixed;inset:0;background:rgba(28,25,23,.5);z-index:55;display:none}.scrim.on{display:block}
 nav a{min-height:44px}
 .g4{grid-template-columns:1fr 1fr}.g2,.g3,.dbgrid{grid-template-columns:1fr}
 main{padding:18px 16px 40px}
 h1{font-size:28px}.top{margin-bottom:14px}.top .row{width:100%}.top .row>*{flex:1 1 auto}
 .kpi .val{font-size:26px}
 .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}.tabs button{white-space:nowrap;min-height:44px}
 .tw table,.tw tbody,.tw tr,.tw td{display:block;width:100%}.tw thead{display:none}
 .tw tr{border:1px solid var(--line2);border-radius:12px;margin-bottom:10px;padding:6px 14px;background:var(--card)}
 .tw tr:hover td{background:none}
 .tw td{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border:0;padding:8px 0;text-align:end;max-width:none!important}
 .tw td::before{content:attr(data-l);color:var(--mut);font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-align:start;flex:0 0 38%}
 .tw td[data-l=""]::before{display:none}.tw td[data-l=""]{justify-content:flex-end}
 .tw td[colspan]{justify-content:center}
 .modal{padding:0;place-items:end stretch}.modal>div{max-height:92vh;border-radius:20px 20px 0 0;padding:20px}
 .btn{min-height:40px}.btn.s{min-height:36px}
 input,select,textarea{font-size:16px}
 .toast{left:12px;right:12px;bottom:12px;max-width:none}
}
@media(max-width:520px){.g4{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:14px}.kpi .val{font-size:22px}.kpi .d{font-size:11px}.card{padding:14px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>'$'+Math.round(Number(n||0)).toLocaleString('en-US');
const dt=s=>s?String(s).replace('T',' ').slice(0,16):'—';
const S={me:null,perms:[],page:'dashboard',range:30,sandbox:false,cache:{}};
const can=p=>S.perms.includes('*')||S.perms.includes(p);
async function api(path,opt={}){
  const o={method:opt.body?'POST':'GET',credentials:'same-origin',headers:{}};
  if(opt.body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(opt.body)}
  const r=await fetch('/api'+path,o);
  if(opt.raw)return r;
  let d={};try{d=await r.json()}catch(_){}
  if(!r.ok){const e=new Error(d.error||('Xato '+r.status));e.data=d;e.status=r.status;if(d.need2fa_setup&&S.me){render2faRequired();throw e}if(r.status===401&&S.me&&!path.startsWith('/staff/login')){S.me=null;renderLogin('Sessiya tugadi, qayta kiring.')}throw e}
  return d;
}
function drawQr(){document.querySelectorAll('.qr[data-uri]').forEach(el=>{if(el.dataset.done||!el.dataset.uri)return;if(!window.QRCode)return setTimeout(drawQr,300);el.dataset.done=1;new QRCode(el,{text:el.dataset.uri,width:180,height:180,colorDark:'#1C1917',colorLight:'#FFFDF9'})})}
new MutationObserver(drawQr).observe(document.documentElement,{childList:true,subtree:true});
function toast(m,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),err?6000:3000)}
const guard=fn=>async(...a)=>{try{return await fn(...a)}catch(e){toast(e.message,true)}};
const statusPill=s=>{const m={pending:['warn','Kutilmoqda'],awaiting_payment:['','To\'lov kutilmoqda'],confirmed:['info','Tasdiqlangan'],completed:['ok','Yakunlangan'],cancelled:['bad','Bekor'],paid:['ok','To\'langan'],refunded:['','Qaytarilgan'],partially_refunded:['warn','Qisman qaytarilgan'],failed:['bad','Muvaffaqiyatsiz'],expired:['','Muddati tugadi'],requested:['warn','So\'ralgan'],approved:['info','Tasdiqlangan'],processed:['ok','Bajarilgan'],rejected:['bad','Rad etilgan'],active:['ok','Faol'],suspended:['bad','To\'xtatilgan']};const x=m[s]||['',s];return `<span class="pill ${x[0]}">${esc(x[1])}</span>`};
const typeLbl={guide:'Gid',package:'Tur-paket',other:'Boshqa'};

/* ---------- Kirish ---------- */
function renderLogin(msg,need2fa){
  $('#root').innerHTML=`<div class="login"><form id="lf"><div class="logo"><i></i><div>Manzil<small>Admin · faqat xodimlar uchun</small></div></div><h2>Xush kelibsiz</h2>
  ${msg?`<div class="note">${esc(msg)}</div>`:''}
  <input name="email" type="email" placeholder="Email" autocomplete="username" required>
  <input name="password" type="password" placeholder="Parol" autocomplete="current-password" required>
  <input name="totp" inputmode="numeric" maxlength="6" placeholder="Autentifikator kodi (agar yoqilgan bo'lsa)" style="${need2fa?'':'display:none'}" autocomplete="one-time-code">
  <button class="btn p">Kirish</button><div class="small muted">Barcha kirishlar va amallar audit jurnaliga yoziladi.</div></form></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
    try{await api('/staff/login',{body:{email:f.get('email'),password:f.get('password'),totp:f.get('totp')||undefined}});await boot()}
    catch(er){if(er.data&&er.data.need2fa){renderLogin(er.message,true)}else toast(er.message,true)}};
}
function renderMustChange(){
  $('#root').innerHTML=`<div class="login"><form id="pf"><h2 style="margin:0">Parolni almashtiring</h2><div class="note">Birinchi kirish yoki parol tiklangan. Yangi parol kamida 12 belgi bo'lsin.</div>
  <input name="c" type="password" placeholder="Joriy parol" required><input name="n" type="password" placeholder="Yangi parol (12+ belgi)" minlength="12" required><button class="btn p">Saqlash</button></form></div>`;
  $('#pf').onsubmit=guard(async e=>{e.preventDefault();const f=new FormData(e.target);await api('/staff/password',{body:{current:f.get('c'),password:f.get('n')}});toast('Parol almashtirildi. Qayta kiring.');renderLogin()});
}

async function render2faRequired(){
  const d=await fetch('/api/staff/2fa/setup',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:'{}'}).then(r=>r.json()).catch(()=>({}));
  $('#root').innerHTML=`<div class="login"><form id="tf"><h2 style="margin:0">Ikki bosqichli himoya majburiy</h2><div class="note">Moliya va admin huquqiga ega xodimlar uchun 2FA yoqilishi shart. Telefoningizdagi Authenticator ilovasida (Google Authenticator, Authy, 1Password) QR kodni skanerlang, so'ng ilova ko'rsatgan 6 xonali kodni yozing.</div><div class="qr" data-uri="${esc(d.uri||'')}"></div>
  <p class="mono" style="word-break:break-all;background:var(--bg);padding:10px;border-radius:8px">${esc(d.secret||'—')}</p><p class="small muted mono" style="word-break:break-all">${esc(d.uri||'')}</p>
  <input name="c" inputmode="numeric" maxlength="6" placeholder="6 xonali kod" autocomplete="one-time-code" required><button class="btn p">Yoqish</button><button class="btn" type="button" id="tlo">Chiqish</button></form></div>`;
  $('#tlo').onclick=guard(async()=>{await api('/staff/logout',{body:{}});S.me=null;renderLogin()});
  $('#tf').onsubmit=guard(async e=>{e.preventDefault();await api('/staff/2fa/enable',{body:{code:new FormData(e.target).get('c')}});toast('2FA yoqildi.');await boot()});
}

/* ---------- Karkas ---------- */
const NAV=[['Asosiy',[['dashboard','📊','Boshqaruv paneli','dashboard'],['bookings','🧾','Buyurtmalar','bookings.read'],['payments','💳','To\'lovlar','payments.read'],['refunds','↩️','Qaytarishlar','payments.read'],['support','💬','Support (murojaatlar)','feedback.read']]],
['Moliya',[['accounting','📒','Hisob-kitob','accounting.read']]],
['Jamoa',[['performance','🏅','Xodimlar samaradorligi','staff.performance.any'],['staff','👥','Xodimlar va rollar','staff.read']]],
['Katalog',[['guides','🧭','Gidlar','guides.read'],['operators','🏢','Tur operatorlar','guides.read'],['packages','📦','Tur-paketlar','guides.read'],['destinations','📍','Manzillar','destinations.write'],['users','🙋','Foydalanuvchilar','users.read'],['feedback','⭐','Fikr va sharhlar','feedback.read']]],
['Tizim',[['db','🗄️','Ma\'lumotlar bazasi','db.view'],['audit','🛡️','Audit jurnali','audit.read'],['telegram','✈️','Telegram bot','settings.write'],['backup','💾','Zaxira nusxalar','db.view'],['settings','⚙️','Sozlamalar','settings.write']]]];
const navOk=p=>p==='staff.performance.any'?(can('staff.performance')||can('staff.performance.self')):can(p);
function shell(){
  $('#root').innerHTML=`<div class="mtop"><div class="logo"><i></i><div>Manzil</div></div><button id="mnav" aria-label="Menyu" aria-expanded="false">☰</button></div><div class="scrim" id="scrim"></div><div class="app"><aside id="side"><div class="logo"><i></i><div>Manzil<small>Admin</small></div></div><nav>${NAV.map(([t,items])=>{const v=items.filter(i=>navOk(i[3]));return v.length?`<div class="sec">${t}</div>`+v.map(i=>`<a data-p="${i[0]}" class="${S.page===i[0]?'on':''}">${i[2]}</a>`).join(''):''}).join('')}</nav>
  <div class="who"><b>${esc(S.me.name)}</b>${esc(S.me.roleLabel)}<div style="margin-top:8px" class="row"><button class="btn s" id="b2fa">${S.me.totpEnabled?'2FA yoqilgan ✓':'2FA yoqish'}</button><button class="btn s" id="blo">Chiqish</button></div></div></aside><main id="main"></main></div>`;
  document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{S.page=a.dataset.p;location.hash=S.page;shell();show();window.scrollTo(0,0)});
  const side=$('#side'),scrim=$('#scrim'),mb=$('#mnav');const tog=o=>{side.classList.toggle('open',o);scrim.classList.toggle('on',o);mb.setAttribute('aria-expanded',o)};
  mb.onclick=()=>tog(!side.classList.contains('open'));scrim.onclick=()=>tog(false);
  $('#blo').onclick=guard(async()=>{await api('/staff/logout',{body:{}});S.me=null;renderLogin()});
  $('#b2fa').onclick=guard(setup2fa);
}
async function setup2fa(){
  if(S.me.totpEnabled)return toast('2FA allaqachon yoqilgan.');
  const d=await api('/staff/2fa/setup',{body:{}});
  modal(`<h3>Ikki bosqichli himoya (2FA)</h3><p>Telefoningizdagi Authenticator ilovasida (Google Authenticator, Authy, 1Password) QR kodni skanerlang yoki kalitni qo'lda kiriting:</p><div class="qr" data-uri="${esc(d.uri)}"></div><p class="mono" style="word-break:break-all;background:var(--bg);padding:10px;border-radius:8px">${esc(d.secret)}</p><p class="small muted">URI: <span class="mono" style="word-break:break-all">${esc(d.uri)}</span></p><div class="row"><input id="c2" inputmode="numeric" maxlength="6" placeholder="6 xonali kod"><button class="btn p" id="ok2">Yoqish</button></div>`);
  $('#ok2').onclick=guard(async()=>{await api('/staff/2fa/enable',{body:{code:$('#c2').value}});S.me.totpEnabled=true;closeModal();shell();show();toast('2FA yoqildi.')});
}

/* ---------- Grafiklar (SVG) ---------- */
const COLORS=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
function donut(items){
  const tot=items.reduce((a,x)=>a+x.v,0);if(!tot)return '<div class="muted">Hali daromad yo\'q</div>';
  let a0=-Math.PI/2;const R=62,r=40,cx=80,cy=80;let paths='';
  items.forEach((x,i)=>{const a=x.v/tot*Math.PI*2,a1=a0+Math.min(a,Math.PI*2-0.001);const p=(R0,t)=>[cx+R0*Math.cos(t),cy+R0*Math.sin(t)];const[x0,y0]=p(R,a0),[x1,y1]=p(R,a1),[x2,y2]=p(r,a1),[x3,y3]=p(r,a0),lg=a>Math.PI?1:0;
    paths+=`<path d="M${x0} ${y0}A${R} ${R} 0 ${lg} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${lg} 0 ${x3} ${y3}Z" fill="${COLORS[i%5]}"><title>${esc(x.l)}: ${fmt(x.v)}</title></path>`;a0+=a});
  return `<div class="row" style="gap:18px"><svg width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Daromad taqsimoti">${paths}<text x="80" y="77" text-anchor="middle" font-size="11" fill="var(--mut)">Jami</text><text x="80" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${fmt0(tot)}</text></svg>
  <div class="legend" style="flex-direction:column;margin:0">${items.map((x,i)=>`<span><i style="background:${COLORS[i%5]}"></i>${esc(x.l)} — ${fmt0(x.v)} (${Math.round(x.v/tot*100)}%)</span>`).join('')}</div></div>`;
}
function lineChart(pts,key,key2){
  const W=640,H=220,P={l:48,r:12,t:12,b:26};const max=Math.max(100,...pts.map(p=>Math.max(p[key],key2?p[key2]:0)));
  const nice=v=>{const m=Math.pow(10,Math.floor(Math.log10(v)));return Math.ceil(v/m*2)/2*m};const top=nice(max);
  const X=i=>P.l+(pts.length<2?0:i*(W-P.l-P.r)/(pts.length-1)),Y=v=>P.t+(H-P.t-P.b)*(1-v/top);
  const line=k=>pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[k]).toFixed(1)).join('');
  let grid='';for(let i=0;i<=4;i++){const v=top*i/4,y=Y(v);grid+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${P.l-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--mut)">${fmt0(v)}</text>`}
  const step=Math.max(1,Math.ceil(pts.length/7));let xl='';pts.forEach((p,i)=>{if(i%step===0)xl+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--mut)">${p.date.slice(5)}</text>`});
  const dots=pts.map((p,i)=>p[key]>0?`<circle cx="${X(i)}" cy="${Y(p[key])}" r="3" fill="var(--c1)"><title>${p.date}: ${fmt(p[key])}</title></circle>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Daromad dinamikasi">${grid}${xl}<path d="${line(key)}" fill="none" stroke="var(--c1)" stroke-width="2.2"/>${key2?`<path d="${line(key2)}" fill="none" stroke="var(--c2)" stroke-width="2" stroke-dasharray="5 3"/>`:''}${dots}</svg>
  <div class="legend"><span><i style="background:var(--c1)"></i>Aylanma (GMV)</span>${key2?'<span><i style="background:var(--c2)"></i>Komissiya (daromad)</span>':''}</div>`;
}

  <p class="small muted">Shundan keyin mijoz murojaatlari guruhga keladi. Xabarga <b>Reply</b> qilib javob yozsangiz — mijozga boradi. <span class="mono">/close</span> (reply bilan) — murojaatni yopadi.</p></div></div>`;
  const b=$('#tgSetup');if(b)b.onclick=guard(async()=>{const r=await api('/admin/telegram/setup',{body:{}});toast(r.webhook?'Webhook o\'rnatildi':'Bajarildi');show()})};
PAGES.backup=async m=>{const d=await api('/admin/backups');
  m.innerHTML=head('Zaxira nusxalar','Har kuni 03:30 (Toshkent) avtomatik; oxirgi '+d.keep+' tasi saqlanadi',`<a class="btn p" href="/api/admin/backup">Hozir nusxa olish va yuklab olish</a>`)+`${d.persistent?'':'<div class="note">Diqqat: baza vaqtinchalik xotirada — server qayta ishga tushsa ma\'lumotlar yo\'qoladi. Render\'da doimiy disk (Persistent Disk) ulang.</div>'}<div class="card"><p class="small muted">Papka: <span class="mono">${esc(d.dir)}</span></p>${table(['Fayl','Hajmi','Vaqt'],d.files.map(f=>`<tr><td class="mono">${esc(f.name)}</td><td>${(f.size/1024/1024).toFixed(2)} MB</td><td>${dt(f.at)}</td></tr>`),'Hali nusxa yo\'q')}<p class="small muted">Tiklash: serverni to'xtating, kerakli .db faylni DB_PATH o'rniga qo'ying va qayta ishga tushiring.</p></div>`};
PAGES.destinations=async m=>{const d=await api('/admin/destinations');m.innerHTML=head('Manzillar','Narx holati: tasdiqlangan / taxminiy / mavjud emas','<button class="btn p" id="nd">+ Manzil</button>')+`<div class="card">${table(['Nomi','Mamlakat','Kunlik byudjet','Narx holati','Holat',''],d.destinations.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.country||'')}</td><td>${x.dailyBudgetUsd?fmt0(x.dailyBudgetUsd):'—'}</td><td><select onchange="dPs('${x.id}',this.value)">${['verified','estimated','unavailable'].map(k=>`<option value="${k}" ${k===x.priceStatus?'selected':''}>${{verified:'Tasdiqlangan',estimated:'Taxminiy',unavailable:'Mavjud emas'}[k]}</option>`).join('')}</select></td><td>${x.archived?statusPill('suspended'):statusPill('active')}</td><td><button class="btn s" onclick="dArc('${x.id}',${x.archived?0:1})">${x.archived?'Tiklash':'Arxivlash'}</button></td></tr>`),'Hali manzil qo\'shilmagan (sayt o\'z ichki ro\'yxatidan foydalanadi)')}</div>`;
  $('#nd').onclick=()=>{modal(`<h3>Yangi manzil</h3><div class="grid g2"><input id="dn" placeholder="Nomi"><input id="dc" placeholder="Mamlakat"><input id="db" type="number" placeholder="Kunlik byudjet USD"><select id="dp"><option value="estimated">Taxminiy</option><option value="verified">Tasdiqlangan</option><option value="unavailable">Mavjud emas</option></select></div><textarea id="dd" placeholder="Tavsif, eng yaxshi mavsum, xavfsizlik…" rows="3" style="margin-top:8px"></textarea><button class="btn p" id="dok" style="margin-top:8px">Saqlash</button>`);$('#dok').onclick=guard(async()=>{await api('/admin/destinations',{body:{name:$('#dn').value,country:$('#dc').value,dailyBudgetUsd:$('#db').value,priceStatus:$('#dp').value,description:$('#dd').value}});closeModal();show()})}};
window.dPs=guard(async(id,v)=>{await api(`/admin/destinations/${id}/update`,{body:{priceStatus:v}});toast('Saqlandi')});window.dArc=guard(async(id,a)=>{await api(`/admin/destinations/${id}/update`,{body:{archived:!!a}});show()});
PAGES.users=async m=>{const d=await api('/admin/users'+(S.cache.uq?'?q='+encodeURIComponent(S.cache.uq):''));m.innerHTML=head('Foydalanuvchilar','Parollar hech qachon ko\'rsatilmaydi',`<input id="uq" placeholder="Ism yoki email" value="${esc(S.cache.uq||'')}">`)+`<div class="card">${table(['Foydalanuvchi','Ro\'yxatdan o\'tgan','Oxirgi kirish','Buyurtmalar','Holat',''],d.users.map(u=>`<tr><td><b>${esc(u.name)}</b><div class="muted small">${esc(u.email)}</div></td><td>${dt(u.createdAt)}</td><td>${dt(u.lastLogin)}</td><td>${u.bookings}</td><td>${statusPill(u.status)}</td><td>${can('users.write')?`<button class="btn s" onclick="uSt('${u.id}','${u.status==='active'?'suspended':'active'}')">${u.status==='active'?'To\'xtatish':'Faollashtirish'}</button>`:''}</td></tr>`))}</div>`;$('#uq').onchange=e=>{S.cache.uq=e.target.value;show()}};
window.uSt=guard(async(id,s)=>{await api(`/admin/users/${id}/status`,{body:{status:s}});show()});
PAGES.feedback=async m=>{const d=await api('/admin/feedback');m.innerHTML=head('Fikr va sharhlar','')+`<div class="grid g2"><div class="card"><h3>Fikr-mulohazalar</h3>${table(['Sana','Kimdan','Xabar','Holat',''],d.feedback.map(f=>`<tr><td>${dt(f.at)}</td><td>${esc(f.name||'')}<div class="muted small">${esc(f.contact||'')}</div></td><td>${esc(f.message)}</td><td>${statusPill(f.status==='new'?'pending':'completed')}</td><td>${can('feedback.write')&&f.status==='new'?`<button class="btn s" onclick="fbH('${f.id}')">Ko'rildi</button>`:esc(f.handler||'')}</td></tr>`))}</div><div class="card"><h3>Mijoz baholari</h3>${table(['Buyurtma','Baho','Xodim','Gid','Izoh'],d.reviews.map(r=>`<tr><td class="mono">${esc(r.code)}</td><td>★ ${r.rating}</td><td>${esc(r.staff||'—')}</td><td>${esc(r.guide||'—')}</td><td>${esc(r.comment||'')}</td></tr>`))}</div></div>`};
window.fbH=guard(async id=>{await api(`/admin/feedback/${id}/handle`,{body:{status:'handled'}});show()});

PAGES.db=async m=>{
  const d=await api('/admin/db');const t=S.cache.dbt||'users';const off=S.cache.dbo||0;const r=await api(`/admin/db/${t}?limit=25&offset=${off}`);
  m.innerHTML=head('Ma\'lumotlar bazasi',`${esc(d.engine)} · ${esc(d.location)}`)+`<div class="note" style="margin-bottom:14px">🔒 ${esc(d.note)} Jadvalni ko'rish ham audit jurnaliga yoziladi.</div><div class="grid dbgrid"><div class="card" style="padding:8px">${d.tables.map(x=>`<a style="display:flex;justify-content:space-between;padding:7px 10px;border-radius:8px;cursor:pointer;${x.name===t?'background:var(--brand);color:#fff':''}" data-t="${x.name}"><span>${x.name}</span><span class="small">${x.rows}</span></a>`).join('')}</div>
  <div class="card"><h3>${esc(t)} <span class="muted small">(${r.total} qator${r.masked.length?` · yashirin ustunlar: ${r.masked.join(', ')}`:''})</span></h3><div class="tw"><table class="small"><thead><tr>${r.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${r.rows.map(row=>`<tr>${r.columns.map(c=>`<td class="${r.masked.includes(c)?'pill':''}" style="max-width:260px;word-break:break-word">${row[c]==null?'<span class="muted">NULL</span>':esc(row[c])}</td>`).join('')}</tr>`).join('')||'<tr><td class="muted">Bo\'sh</td></tr>'}</tbody></table></div>
  <div class="row" style="margin-top:10px"><button class="btn s" id="pv" ${off?'':'disabled'}>← Oldingi</button><button class="btn s" id="nx" ${off+25<r.total?'':'disabled'}>Keyingi →</button></div></div></div>`;
  m.querySelectorAll('[data-t]').forEach(a=>a.onclick=()=>{S.cache.dbt=a.dataset.t;S.cache.dbo=0;show()});$('#pv').onclick=()=>{S.cache.dbo=Math.max(0,off-25);show()};$('#nx').onclick=()=>{S.cache.dbo=off+25;show()};
};
PAGES.audit=async m=>{const d=await api('/admin/audit?limit=150'),v=await api('/admin/audit/verify');m.innerHTML=head('Audit jurnali','Kim, nimani, qachon, avval va keyin qanday o\'zgartirgan',`<span class="pill ${v.ok?'ok':'bad'}">${v.ok?`Zanjir butun ✓ (${v.checked} yozuv)`:`ZANJIR BUZILGAN: #${v.brokenAt}`}</span>`)+`<div class="card">${table(['#','Vaqt','Kim','Amal','Obyekt','Avval → Keyin'],d.entries.map(e=>`<tr><td>${e.seq}</td><td>${dt(e.at)}</td><td>${esc(e.actor)}<div class="muted small">${esc(e.ip||'')}</div></td><td><b>${esc(e.action)}</b></td><td class="small">${esc(e.entity)} <span class="mono">${esc(e.entityId)}</span></td><td class="mono small" style="max-width:340px;word-break:break-word">${e.before?esc(JSON.stringify(e.before)):''}${e.before&&e.after?' → ':''}${e.after?esc(JSON.stringify(e.after)):''}</td></tr>`))}</div>`};
PAGES.settings=async m=>{const d=await api('/admin/settings'),s=d.settings,i=d.integrations;m.innerHTML=head('Sozlamalar','Har bir o\'zgarish audit jurnaliga yoziladi')+`<div class="grid g2"><div class="card"><h3>Biznes qoidalari</h3><div class="grid"><label>Komissiya (0–0.5)<input id="s1" value="${esc(s.commission_rate)}"></label><label>1 USD = so'm<input id="s2" value="${esc(s.usd_uzs_rate)}"></label><label>SLA (daqiqa)<input id="s3" value="${esc(s.sla_confirm_minutes)}"></label><label>Bekor qilish siyosati (JSON: sayohatgacha ≥ minDays kun qolsa pct% qaytariladi)<textarea id="s4" rows="3">${esc(s.cancel_policy)}</textarea></label><label>Qaytarishni o'zi tasdiqlashga ruxsat (faqat super admin)<select id="s5"><option value="false" ${s.refund_self_approve==='false'?'selected':''}>Yo'q (tavsiya)</option><option value="true" ${s.refund_self_approve==='true'?'selected':''}>Ha</option></select></label><button class="btn p" id="ss">Saqlash</button></div><p class="small muted">Bekor qilish siyosati — farazdagi standart qiymat; biznes qarori bilan tasdiqlang.</p></div>
  <div class="card"><h3>Integratsiyalar</h3>${[['Stripe (karta)',i.stripe&&i.stripeWebhook],['Click',i.click],['Payme',i.payme],['Telegram',i.telegram],['OpenAI',i.openai]].map(([n,o])=>`<div class="row" style="justify-content:space-between;margin:6px 0"><span>${n}</span><span class="pill ${o?'ok':''}">${o?'ulangan':'ulanmagan'}</span></div>`).join('')}<div class="row" style="justify-content:space-between"><span>Rejim</span><span class="pill ${i.production?'ok':'warn'}">${i.production?'production':'development'}</span></div>${i.demoPayments?'<div class="note" style="margin-top:8px">DEMO_PAYMENTS yoqilgan — sinov to\'lovlari mumkin. Productionda o\'chiring.</div>':''}<h3 style="margin-top:16px">AI</h3><div class="small">Bugun: ${d.ai.today}/${d.ai.limit} · Jami: ${d.ai.total} · Zaxira (fallback) javoblar: ${d.ai.fallback}</div><p class="small muted">Click/Payme merchant API hali ulanmagan: bu usullar tanlanganda mijozga aniq xato ko'rsatiladi.</p></div></div>`;
  $('#ss').onclick=guard(async()=>{await api('/admin/settings',{body:{commission_rate:$('#s1').value,usd_uzs_rate:$('#s2').value,sla_confirm_minutes:$('#s3').value,cancel_policy:$('#s4').value,refund_self_approve:$('#s5').value}});toast('Saqlandi')})};

/* ---------- Boshlash ---------- */
async function boot(){
  let d;try{d=await api('/staff/me')}catch(e){return renderLogin()}
  S.me=d.staff;S.perms=d.perms;S.sys=d.system||{};if(d.staff.mustChangePw)return renderMustChange();
  if(S.sys.require2fa&&!d.staff.totpEnabled)return render2faRequired();
  try{
    const h=location.hash.slice(1);if(PAGES[h])S.page=h;
    if(!NAV.some(([,it])=>it.some(i=>i[0]===S.page&&navOk(i[3]))))S.page=(NAV[0][1].find(i=>navOk(i[3]))||NAV[0][1][0])[0];
    shell();show()}
  catch(e){renderLogin()}
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(S.me&&PAGES[h]&&h!==S.page){S.page=h;shell();show()}});
boot();
</script>
