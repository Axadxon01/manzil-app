# Render Blueprint — Dashboard > New > Blueprint > shu repo ni tanlang
services:
  - type: web
    name: manzil-app
    runtime: node
    plan: starter            # Persistent Disk faqat pullik rejada ishlaydi (free rejada baza har deployda o'chadi)
    region: ohio            # mavjud manzil-app xizmati bilan bir xil (disk mintaqani o'zgartirib bo'lmaydi)
    branch: main
    buildCommand: echo "npm paketlari kerak emas"
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: manzil-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/manzil.db
      - key: PUBLIC_URL
        sync: false          # masalan https://manzil.onrender.com yoki https://manzil.uz
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false          # kamida 12 belgi; birinchi kirishdan keyin panelda almashtiring
      - key: DEMO_PAYMENTS
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false          # ixtiyoriy: support guruhini /support_here KOD bilan ham ulash mumkin
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_KEY
        sync: false
      - key: BACKUP_DIR
        value: /data/backups
      - key: OPENAI_API_KEY
        sync: false
